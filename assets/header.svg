<svg width="100%" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="50%" stop-color="#00F72D"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="50%" stop-color="#00c724"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <style>
      .bgRect { fill: url(#bgGrad); }
      .waveShape {
        fill: url(#waveGrad);
        opacity: 0.35;
        transform-origin: 600px 110px;
        animation: waveMove 6s ease-in-out infinite;
      }
      .waveShape2 {
        fill: url(#waveGrad);
        opacity: 0.2;
        transform-origin: 600px 130px;
        animation: waveMove 8s ease-in-out infinite reverse;
      }
      @keyframes waveMove {
        0%   { transform: translateX(0px) translateY(0px); }
        50%  { transform: translateX(-40px) translateY(8px); }
        100% { transform: translateX(0px) translateY(0px); }
      }
      .titleText {
        font-family: 'Courier New', monospace;
        font-weight: 700;
        font-size: 60px;
        fill: #ffffff;
        opacity: 0;
        animation: fadeIn 1.6s ease-out forwards;
      }
      .descText {
        font-family: 'Courier New', monospace;
        font-weight: 500;
        font-size: 22px;
        fill: #e6ffe9;
        opacity: 0;
        animation: fadeIn 1.6s ease-out 0.5s forwards;
      }
      @keyframes fadeIn {
        0%   { opacity: 0; transform: translateY(10px); }
        100% { opacity: 1; transform: translateY(0px); }
      }
    </style>
  </defs>

  <rect class="bgRect" width="1200" height="220"/>

  <path class="waveShape2" d="M0,150 C150,190 300,110 450,150 C600,190 750,110 900,150 C1050,190 1150,140 1200,150 L1200,220 L0,220 Z"/>
  <path class="waveShape" d="M0,170 C150,130 300,200 450,170 C600,140 750,200 900,170 C1050,140 1150,180 1200,170 L1200,220 L0,220 Z"/>

  <text x="600" y="105" text-anchor="middle" class="titleText">Rahul Satvik</text>
  <text x="600" y="145" text-anchor="middle" class="descText">Full Stack Developer | MERN &amp; Next.js</text>
</svg>
